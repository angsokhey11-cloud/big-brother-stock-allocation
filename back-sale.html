<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIG BROTHER · Back Sale Receive</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#17314c;font:15px system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:16px}.card{background:white;border:1px solid #d7e1ec;border-radius:14px;padding:18px;margin:12px 0}h1{margin:0}h2{font-size:19px}.muted{font-size:13px;color:#657a90}button,select,input{font:inherit;border:1px solid #adc2d6;border-radius:9px;padding:10px;background:white;color:#193c61}button{cursor:pointer;font-weight:650}.primary{background:#164b7b;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-weight:650;margin:8px 0 5px}select,input{width:100%}.hidden{display:none}.item{border:1px solid #d7e1ec;border-radius:10px;padding:12px;margin:9px 0}.itemgrid{display:grid;grid-template-columns:1fr 110px 75px;gap:10px;align-items:center}.error{color:#b52525}@media(max-width:550px){.itemgrid{grid-template-columns:1fr 90px 65px}}</style></head><body><div class="wrap"><div class="card"><h1>📦 BIG BROTHER</h1><p>Back Sale Receive · Separate report</p><p class="muted">Report preparation only. No stock movement is recorded here.</p><div id="status">Connecting…</div><button id="refresh">↻ Refresh open batches</button></div><div class="row"><button id="tabReceive" class="primary">Back Sale Receive</button><button id="tabHistory">Back Sale History</button></div><main id="receive"><div class="card"><h2>Return Information</h2><div class="grid"><div><label>Inventory Controller</label><input id="controller" readonly></div><div><label>Open Batch</label><select id="batch"><option value="">Loading…</option></select></div></div><div id="batchInfo" class="muted"></div></div><div class="card"><h2>Returned Products</h2><div class="row"><select id="product" style="flex:1;min-width:180px"><option value="">Select product</option></select><button id="add">+ Add Product</button></div><div id="items"></div><div id="total"><b>Total: 0 PCS</b></div><div class="row" style="margin-top:15px"><button id="clear">Clear</button><button class="primary" id="save">Save Back Sale Report</button></div></div></main><main id="history" class="card hidden"><h2>Back Sale History</h2><p class="muted">Saved only on this browser/device. Clearing browser data removes this history.</p><div id="records"></div></main></div><script>(()=>{'use strict';const URL='https://sjfhlaclgmkwwofzstok.supabase.co',KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S',SESSION='BB_SUPABASE_DEV_SESSION_V1',STORE='BB_BACK_SALE_LOCAL_V1',$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let batches=[],products=[],profile=null,lines={},editing=null;const local=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}};function status(x,bad=false){$('status').textContent=x;$('status').className=bad?'error':''}async function rpc(name){let s=JSON.parse(localStorage.getItem(SESSION)||'null');if(!s?.access_token)throw Error('Sign in to BIG BROTHER first.');if(s.expires_at&&s.expires_at<Date.now()/1000+45){let r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(!r.ok)throw Error('Session expired.');s=await r.json();s.expires_at=Math.floor(Date.now()/1000)+s.expires_in;localStorage.setItem(SESSION,JSON.stringify(s))}let r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:'{}',cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.message||'Database unavailable');return d}async function refresh(){status('Loading open batches…');try{let [ref,data,p]=await Promise.all([rpc('bb_stock_references'),rpc('bb_stock_keyin_fast'),rpc('bb_current_access_profile')]);profile=p;products=(ref.products||[]).map(x=>({code:String(x.productCode||x.code),name:String(x.productName||x.name),unit:String(x.unit||'PCS')}));batches=(data.openBatches||[]).filter(b=>p.user?.isAdmin||p.locations?.some(l=>l.locationCode===b.locationCode));$('controller').value=p.staff?.staffName||'Unlinked staff';$('batch').innerHTML='<option value="">Select open batch</option>'+batches.map((b,i)=>'<option value="'+i+'">'+esc(b.batchId+' · '+(b.locationName||b.locationCode)+' · '+(b.salesmanName||''))+'</option>').join('');showBatch();status('Loaded '+batches.length+' accessible open batches.');}catch(e){status(e.message,true)}}function selectedBatch(){return $('batch').value===''?null:batches[Number($('batch').value)]}function batchProducts(b){const entries=Array.isArray(b?.items)?b.items:[];const codes=new Set(entries.map(x=>String(x.productCode||x.code||'').trim()).filter(Boolean));return products.filter(p=>codes.has(p.code))}function showBatch(){let b=selectedBatch();lines={};render();$('product').innerHTML='<option value="">Select product from batch</option>'+batchProducts(b).map(p=>'<option value="'+esc(p.code)+'">'+esc(p.name+' · '+p.code)+'</option>').join('');$('batchInfo').textContent=b?'Batch: '+b.batchId+' · Location: '+(b.locationName||b.locationCode)+' · Salesman: '+(b.salesmanName||'-')+' · Driver: '+(b.driverName||'-'):''}function render(){let entries=Object.entries(lines);$('items').innerHTML=entries.map(([code,qty])=>{let p=products.find(p=>p.code===code);return '<div class="item itemgrid"><b>'+esc(p?.name||code)+'</b><input type="number" min="0" step="1" data-qty="'+esc(code)+'" value="'+qty+'"><button data-remove="'+esc(code)+'">Remove</button></div>'}).join('')||'<p class="muted">Add the products physically returned by the salesman.</p>';$('total').innerHTML='<b>Total: '+entries.reduce((s,x)=>s+Number(x[1]||0),0)+' PCS</b>';$('items').querySelectorAll('[data-qty]').forEach(x=>x.onchange=()=>{lines[x.dataset.qty]=Math.max(0,Math.floor(Number(x.value)||0));render()});$('items').querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{delete lines[x.dataset.remove];render()})}function report(r){return '📦 BIG BROTHER — BACK SALE STOCK REPORT\nDate: '+new Date(r.created).toLocaleString()+'\nBatch: '+r.batchId+'\nLocation: '+r.locationName+'\nSalesman: '+r.salesmanName+'\nInventory Controller: '+r.controllerName+'\n\n'+r.items.map(x=>x.name+': '+x.qty+' PCS').join('\n')+'\n\nTotal: '+r.items.reduce((s,x)=>s+x.qty,0)+' PCS'}async function copy(t){try{await navigator.clipboard.writeText(t);alert('Report copied!')}catch{prompt('Copy report:',t)}}function history(){ $('receive').classList.add('hidden');$('history').classList.remove('hidden');$('tabReceive').classList.remove('primary');$('tabHistory').classList.add('primary');$('records').innerHTML=local().map(r=>'<div class="item"><b>'+esc(r.batchId)+'</b> · '+new Date(r.created).toLocaleString()+'<p>'+esc(r.locationName)+' · '+esc(r.salesmanName)+' · '+r.items.length+' products</p><div class="row"><button data-id="'+esc(r.id)+'" data-action="copy">Copy Text Report</button><button data-id="'+esc(r.id)+'" data-action="edit">Edit</button><button data-id="'+esc(r.id)+'" data-action="delete">Delete</button></div></div>').join('')||'<p>No saved Back Sale reports on this device.</p>';$('records').querySelectorAll('button').forEach(b=>b.onclick=()=>{let r=local().find(x=>x.id===b.dataset.id);if(!r)return;if(b.dataset.action==='copy')copy(report(r));if(b.dataset.action==='delete'&&confirm('Delete this local report?')){localStorage.setItem(STORE,JSON.stringify(local().filter(x=>x.id!==r.id)));history()}if(b.dataset.action==='edit'){let index=batches.findIndex(x=>x.batchId===r.batchId);if(index<0)return alert('This batch is not currently open or accessible.');editing=r.id;showReceive();$('batch').value=String(index);showBatch();lines=Object.fromEntries(r.items.filter(x=>batchProducts(selectedBatch()).some(p=>p.code===x.code)).map(x=>[x.code,x.qty]));render()}})}function showReceive(){$('receive').classList.remove('hidden');$('history').classList.add('hidden');$('tabReceive').classList.add('primary');$('tabHistory').classList.remove('primary')}$('refresh').onclick=refresh;$('tabReceive').onclick=showReceive;$('tabHistory').onclick=history;$('batch').onchange=showBatch;$('add').onclick=()=>{let p=batchProducts(selectedBatch()).find(x=>x.code===$('product').value);if(!p)return alert('Choose a product.');if(lines[p.code]===undefined)lines[p.code]=0;render()};$('clear').onclick=()=>{if(confirm('Clear current report?')){lines={};editing=null;render()}};$('save').onclick=()=>{let b=selectedBatch();if(!b)return alert('Select an open batch.');if(!profile?.staff?.staffId)return alert('Your account must be linked to a staff profile.');let items=Object.entries(lines).filter(x=>x[1]>0).map(([code,qty])=>({code,name:products.find(p=>p.code===code)?.name||code,qty}));if(!items.length)return alert('Enter return quantities.');let old=local().find(x=>x.id===editing),r={id:editing||'BS-'+Date.now(),created:old?.created||new Date().toISOString(),batchId:b.batchId,locationCode:b.locationCode,locationName:b.locationName||b.locationCode,salesmanName:b.salesmanName||'',controllerName:profile.staff.staffName,items};try{localStorage.setItem(STORE,JSON.stringify([r,...local().filter(x=>x.id!==r.id)]))}catch(e){return alert('Device storage failed: '+e.message)}lines={};editing=null;render();alert('Back Sale report saved on this device. No stock was moved.');history()};refresh()})();</script></body></html>
