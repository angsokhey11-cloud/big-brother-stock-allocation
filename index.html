(async function(){
 try{

  html=html.slice(0,pos)+css+html.slice(pos);
  document.open();document.write(html);document.close();
 }catch(error){
  document.body.innerHTML='<div class="loading">Could not load BIG BROTHER Stock Allocation<br><small>'+String(error.message||error)+'</small></div>';
 }
})();
</script></body></html>
